{% extends "account/entrance.html" %}

{% block title %}Change password — vocab-man{% endblock %}

{% block card %}
  <form method="post" action="{% url 'account_change_password' %}" class="flex flex-col gap-3.5">
    {% csrf_token %}
    {{ redirect_field }}
    <h1 class="text-[22px] font-semibold">Change password</h1>
    {% if form.non_field_errors %}
      <p class="text-[13px] text-clay" role="alert">{{ form.non_field_errors|striptags }}</p>
    {% endif %}
    <label class="flex flex-col gap-2">
      <span class="text-[13px] font-semibold">Current password</span>
      <input type="password" name="oldpassword" placeholder="Current password" autocomplete="current-password" required class="h-12 rounded-xl border bg-white px-3.5 text-[15px] placeholder:text-muted focus:border-teal focus:outline-none {% if form.oldpassword.errors %}border-clay{% else %}border-line{% endif %}">
      {% if form.oldpassword.errors %}<span class="text-[13px] text-clay">{{ form.oldpassword.errors|striptags }}</span>{% endif %}
    </label>
    <label class="flex flex-col gap-2">
      <span class="text-[13px] font-semibold">New password</span>
      <input type="password" name="password1" placeholder="New password" autocomplete="new-password" required class="h-12 rounded-xl border bg-white px-3.5 text-[15px] placeholder:text-muted focus:border-teal focus:outline-none {% if form.password1.errors %}border-clay{% else %}border-line{% endif %}">
      {% if form.password1.errors %}<span class="text-[13px] text-clay">{{ form.password1.errors|striptags }}</span>{% endif %}
    </label>
    <label class="flex flex-col gap-2">
      <span class="text-[13px] font-semibold">Confirm password</span>
      <input type="password" name="password2" placeholder="New password" autocomplete="new-password" required class="h-12 rounded-xl border bg-white px-3.5 text-[15px] placeholder:text-muted focus:border-teal focus:outline-none {% if form.password2.errors %}border-clay{% else %}border-line{% endif %}">
      {% if form.password2.errors %}<span class="text-[13px] text-clay">{{ form.password2.errors|striptags }}</span>{% endif %}
    </label>
    <button type="submit" class="h-11 rounded-xl bg-teal text-sm font-semibold text-white">Change password</button>
  </form>
  <p class="text-center text-[13px] text-muted"><a href="{% url 'home' %}" class="font-semibold text-teal">Back</a></p>
{% endblock %}
