<ul>
  {% for suggestion in suggestions %}
    <li class="border-t border-line first:border-t-0">
      <a href="{% url 'home' %}?q={{ query|urlencode }}&word={{ suggestion.word|urlencode }}" class="block px-[18px] py-2 text-base text-ink {% if suggestion.word == field_value %}font-semibold{% else %}font-medium{% endif %} {% if suggestion.bn %}font-bn{% endif %}">{{ suggestion.word }}</a>
    </li>
  {% endfor %}
</ul>
