{% extends "base.html" %}

{% block title %}Log in — vocab-man{% endblock %}

{% block content %}
  <div class="mx-auto flex w-full max-w-[720px] justify-center px-5 py-[72px] sm:px-0">
    <form method="post" action="{% url 'login' %}" class="flex w-full max-w-[440px] flex-col gap-3.5 rounded-[20px] border border-line bg-card p-7">
      {% csrf_token %}
      <h1 class="text-[22px] font-semibold">Log in</h1>

      <label class="flex flex-col gap-2">
        <span class="text-[13px] font-semibold">Email</span>
        <input type="email" name="email" placeholder="you@email.com" autocomplete="username" class="h-12 rounded-xl border border-line bg-white px-3.5 text-[15px] placeholder:text-muted focus:border-teal focus:outline-none">
      </label>

      <label class="flex flex-col gap-2">
        <span class="text-[13px] font-semibold">Password</span>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" class="h-12 rounded-xl border border-line bg-white px-3.5 text-[15px] placeholder:text-muted focus:border-teal focus:outline-none">
      </label>

      <button type="submit" class="h-11 rounded-xl bg-teal text-sm font-semibold text-white">Log in</button>

      <p class="text-center text-[13px] font-medium text-muted">or</p>

      <button type="button" class="inline-flex h-11 items-center justify-center gap-2.5 rounded-xl border border-line bg-white text-sm font-semibold">
        <svg viewBox="0 0 18 18" class="size-[18px]" aria-hidden="true">
          <path fill="#4285F4" d="M17.6 9.2c0-.6-.1-1.2-.2-1.8H9v3.4h4.8a4.1 4.1 0 0 1-1.8 2.7v2.2h2.9c1.7-1.6 2.7-3.9 2.7-6.5z"></path>
          <path fill="#34A853" d="M9 18c2.4 0 4.5-.8 6-2.2l-2.9-2.2c-.8.6-1.9.9-3.1.9-2.4 0-4.4-1.6-5.1-3.8H.9v2.3A9 9 0 0 0 9 18z"></path>
          <path fill="#FBBC05" d="M3.9 10.7A5.4 5.4 0 0 1 3.6 9c0-.6.1-1.2.3-1.7V5H.9a9 9 0 0 0 0 8l3-2.3z"></path>
          <path fill="#EA4335" d="M9 3.6c1.3 0 2.5.5 3.4 1.3L15 2.3A9 9 0 0 0 .9 5l3 2.3C4.6 5.2 6.6 3.6 9 3.6z"></path>
        </svg>
        Continue with Google
      </button>
    </form>
  </div>
{% endblock %}
