{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vocab-man{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="bg-paper font-sans text-ink antialiased">
  {% include "partials/header.html" %}
  {% if messages %}
    <div class="mx-auto flex w-full max-w-[720px] flex-col gap-2 px-5 pt-4 sm:px-0">
      {% for message in messages %}
        <p class="rounded-xl border border-line bg-card px-4 py-3 text-sm {% if 'error' in message.tags %}text-clay{% endif %}" role="status">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
</body>
</html>
