{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}vocab-man{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
  {% include "partials/header.html" %}
  <div id="toasts" class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2 px-5">
    {% for message in messages %}
      <p data-toast role="status" class="pointer-events-auto w-full max-w-sm rounded-xl border bg-white px-4 py-3 text-sm shadow-[0_8px_24px_rgb(28_25_21/0.14)] transition duration-200 {% if 'error' in message.tags %}border-clay text-clay{% else %}border-line text-ink{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script>
    document.querySelectorAll("[data-toast]").forEach(function (toast) {
      window.setTimeout(function () {
        toast.classList.add("opacity-0");
        window.setTimeout(function () { toast.remove(); }, 200);
      }, toast.classList.contains("text-clay") ? 6000 : 4000);
    });

    const profileMenu = document.getElementById("profile-menu");
    if (profileMenu) {
      const profileButton = document.getElementById("profile-menu-button");
      const profilePanel = document.getElementById("profile-menu-panel");
      function setProfileOpen(open) {
        profileButton.setAttribute("aria-expanded", open ? "true" : "false");
        profilePanel.hidden = !open;
      }
      profileButton.addEventListener("click", function (event) {
        event.stopPropagation();
        setProfileOpen(profileButton.getAttribute("aria-expanded") !== "true");
      });
      document.addEventListener("click", function (event) {
        if (!profileMenu.contains(event.target)) setProfileOpen(false);
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") setProfileOpen(false);
      });
    }
  </script>
</body>
</html>
